name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Runner identity
        run: echo "${{ runner.name }} / ${{ runner.os }} / ${{ runner.arch }}"
      - run: node scripts/pr-metadata-check.mjs
      - run: npm ci
      - run: node scripts/check.mjs
      - run: npm ci --prefix extensions/e2b
      - run: npm test --prefix extensions/e2b
      - name: Real backend lifecycle and isolation
        run: node --test --test-concurrency=1 scripts/worktree/worktree.integration.mjs
  upstream-toolkit:
    needs: check
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: FantasticDevHQ/convex-worktrees
          ref: 52c0b76d960a98afedd48607d6737bc14a954c1e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Serialize upstream test files
        run: python3 -c 'from pathlib import Path; p=Path("scripts/check.mjs"); p.write_text(p.read_text().replace("[\"--test\",", "[\"--test\", \"--test-concurrency=1\","))'
      - run: node scripts/check.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=512
